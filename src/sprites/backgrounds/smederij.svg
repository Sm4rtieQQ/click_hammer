  <rect x="173" y="60" width="4" height="4" fill="#8e98a3" />
  <rect x="184" y="60" width="4" height="4" fill="#8e98a3" />
  <rect x="209" y="31" width="5" height="27" fill="#5c3f28" />
  <rect x="200" y="56" width="22" height="9" fill="#6f7d88" />
  <rect x="200" y="56" width="22" height="3" fill="#8e98a3" />

