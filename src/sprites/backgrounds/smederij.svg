    <rect x="18" y="144" width="10" height="6" />
    <rect x="34" y="146" width="12" height="5" />
    <rect x="54" y="144" width="10" height="6" />
    <rect x="66" y="147" width="10" height="4" />
  </g>
  <g fill="#d9822b">
    <rect x="22" y="146" width="6" height="3" />
    <rect x="40" y="148" width="6" height="3" />
    <rect x="58" y="146" width="6" height="3" />
  </g>

  <!-- Vonken die voor de haardplaat langs omhoog gaan -->
  <g fill="#ffd166">
    <rect x="30" y="92" width="2" height="2" />
    <rect x="48" y="88" width="2" height="2" />
    <rect x="62" y="94" width="2" height="2" />
    <rect x="38" y="84" width="2" height="2" />
