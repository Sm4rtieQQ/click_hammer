  <rect x="0" y="9" width="320" height="3" fill="#4a3524" />
  <rect x="166" y="12" width="8" height="62" fill="#4a3524" />
  <rect x="166" y="12" width="2" height="62" fill="#5c3f28" />

  <!-- Kettingen en gereedschap onder de balk -->
  <g fill="#7d8b96">
    <rect x="178" y="12" width="3" height="6" />
    <rect x="178" y="20" width="3" height="6" />
    <rect x="178" y="28" width="3" height="6" />
    <rect x="210" y="12" width="3" height="5" />
    <rect x="210" y="19" width="3" height="5" />
    <rect x="210" y="26" width="3" height="5" />
  </g>
  <rect x="176" y="34" width="7" height="4" fill="#5c6871" />
  <rect x="180" y="34" width="3" height="8" fill="#5c6871" />
  <g fill="#6f7d88">
    <rect x="173" y="42" width="3" height="20" />
    <rect x="185" y="42" width="3" height="20" />
