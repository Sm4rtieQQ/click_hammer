  <rect x="290" y="102" width="10" height="6" fill="#9dbcd6" />
  <rect x="308" y="104" width="12" height="8" fill="#8e98a3" />

  <!--
    Houtstapel tegen de rechtermuur. Vier door elkaar gelegde stammen vullen
