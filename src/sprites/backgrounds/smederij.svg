    <rect x="48" y="82" width="4" height="4" />
    <rect x="66" y="82" width="4" height="4" />
    <rect x="84" y="82" width="4" height="4" />
  </g>
  <rect x="0" y="90" width="100" height="6" fill="#2a1c19" />

  <!-- Haard van steen -->
  <rect x="0" y="96" width="100" height="70" fill="#6b5a4a" />
  <rect x="0" y="96" width="100" height="4" fill="#8a7a66" />
  <rect x="0" y="162" width="100" height="8" fill="#4e4038" />
  <g fill="#5a4a3c">
    <rect x="2" y="106" width="12" height="8" />
    <rect x="82" y="106" width="16" height="8" />
    <rect x="2" y="126" width="10" height="10" />
    <rect x="86" y="128" width="12" height="10" />
    <rect x="2" y="148" width="14" height="8" />
    <rect x="80" y="150" width="18" height="8" />
  </g>
  <g fill="#7d6b57">
    <rect x="2" y="100" width="8" height="5" />
    <rect x="88" y="100" width="10" height="5" />
    <rect x="4" y="118" width="8" height="6" />
    <rect x="88" y="120" width="10" height="6" />
    <rect x="4" y="140" width="8" height="6" />
    <rect x="88" y="142" width="10" height="6" />
  </g>

  <!-- Vuurmond met gloeiende kolen: het warmste en helderste deel van de scène -->
  <rect x="14" y="104" width="64" height="52" fill="#2a1a14" />
  <rect x="20" y="112" width="52" height="38" fill="#7a2d12" />
  <rect x="26" y="118" width="40" height="26" fill="#d9822b" />
  <rect x="34" y="124" width="24" height="14" fill="#f0a04a" />
  <rect x="40" y="128" width="12" height="6" fill="#ffd166" />
  <rect x="44" y="130" width="4" height="2" fill="#fff3d0" />
