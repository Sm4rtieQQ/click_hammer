<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 200"
  shape-rendering="crispEdges"
>
  <!--
    Smederij, interieur. Zelfde conventies als stad.svg: een scène tekent op een
    eigen 320 x 200 grid, niet op de 16 x 16 spritegrid, en alleen met rect op
    gehele coördinaten.

    Compositie, afgestemd op de manier waarop App.vue de scène toont
    (background-size: cover, position center bottom). Op een breed scherm
    schaalt de tekening met de breedte en valt de bovenste 28 procent weg; het
    paneel bedekt dan de middelste 58 procent. Blijven zichtbaar:
      - x 0-96, y 57-200: haard, vuur en rookvang;
      - x 256-320, y 57-200: gereedschapsrek, lamp, helm en schild;
      - x 100-244, y 156-200: koelwaterkuip en de vloer, want op 320px vult
        het paneel vrijwel de hele breedte en blijven alleen de bovenste en
        onderste strook over.
    Alles wat herkenbaar moet zijn, staat dus laag of helemaal opzij.
  -->

  <!-- Muurbasis; de baksteen hierbovenop levert de mortel tussen de stenen -->
  <rect x="0" y="0" width="320" height="200" fill="#3f2b26" />

  <!-- Baksteen in een verspringend verband -->
  <g fill="#4a332d">
