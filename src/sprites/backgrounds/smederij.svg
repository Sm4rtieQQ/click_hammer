    <rect x="234" y="170" width="30" height="9" />
    <rect x="268" y="170" width="28" height="9" />
    <rect x="300" y="170" width="20" height="9" />
    <rect x="0" y="182" width="34" height="8" />
    <rect x="38" y="182" width="28" height="8" />
    <rect x="70" y="182" width="30" height="8" />
  </g>
  <g fill="#4a3527">
    <rect x="104" y="182" width="26" height="8" />
    <rect x="134" y="182" width="32" height="8" />
    <rect x="170" y="182" width="28" height="8" />
    <rect x="202" y="182" width="34" height="8" />
    <rect x="240" y="182" width="26" height="8" />
    <rect x="270" y="182" width="30" height="8" />
    <rect x="304" y="182" width="16" height="8" />
  </g>
  <g fill="#3f2d20">
    <rect x="110" y="192" width="38" height="8" />
    <rect x="152" y="192" width="30" height="8" />
    <rect x="186" y="192" width="36" height="8" />
