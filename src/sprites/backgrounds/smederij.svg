    <rect x="260" y="150" width="56" height="3" />
  </g>
  <g fill="#5c3f28">
    <rect x="258" y="138" width="60" height="12" />
    <rect x="258" y="162" width="60" height="8" />
  </g>
  <g fill="#7d5a36">
    <rect x="260" y="138" width="56" height="3" />
    <rect x="260" y="162" width="56" height="3" />
  </g>

  <!--
    Vloer. De tint loopt van warm bij het vuur naar koel rechts, zodat het
    licht uit de haard met één rij kleuren vertelt.
  -->
  <rect x="0" y="170" width="320" height="30" fill="#3f2d20" />
  <g fill="#7d5a36">
    <rect x="0" y="170" width="30" height="9" />
    <rect x="34" y="170" width="30" height="9" />
    <rect x="68" y="170" width="28" height="9" />
    <rect x="0" y="192" width="40" height="8" />
