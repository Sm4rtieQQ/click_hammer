    <rect x="32" y="18" width="30" height="10" />
    <rect x="64" y="18" width="30" height="10" />
    <rect x="96" y="18" width="30" height="10" />
    <rect x="128" y="18" width="30" height="10" />
    <rect x="160" y="18" width="30" height="10" />
    <rect x="192" y="18" width="30" height="10" />
    <rect x="224" y="18" width="30" height="10" />
    <rect x="256" y="18" width="30" height="10" />
    <rect x="288" y="18" width="30" height="10" />
    <rect x="0" y="42" width="30" height="10" />
    <rect x="32" y="42" width="30" height="10" />
    <rect x="64" y="42" width="30" height="10" />
    <rect x="96" y="42" width="30" height="10" />
    <rect x="128" y="42" width="30" height="10" />
    <rect x="160" y="42" width="30" height="10" />
    <rect x="192" y="42" width="30" height="10" />
    <rect x="224" y="42" width="30" height="10" />
    <rect x="256" y="42" width="30" height="10" />
    <rect x="288" y="42" width="30" height="10" />
    <rect x="0" y="66" width="30" height="10" />
    <rect x="32" y="66" width="30" height="10" />
    <rect x="64" y="66" width="30" height="10" />
    <rect x="96" y="66" width="30" height="10" />
    <rect x="128" y="66" width="30" height="10" />
    <rect x="160" y="66" width="30" height="10" />
    <rect x="192" y="66" width="30" height="10" />
    <rect x="224" y="66" width="30" height="10" />
    <rect x="256" y="66" width="30" height="10" />
    <rect x="288" y="66" width="30" height="10" />
  </g>
  <g fill="#3a2721">
    <rect x="16" y="30" width="30" height="10" />
    <rect x="48" y="30" width="30" height="10" />
    <rect x="80" y="30" width="30" height="10" />
    <rect x="112" y="30" width="30" height="10" />
    <rect x="144" y="30" width="30" height="10" />
    <rect x="176" y="30" width="30" height="10" />
    <rect x="208" y="30" width="30" height="10" />
    <rect x="240" y="30" width="30" height="10" />
    <rect x="272" y="30" width="30" height="10" />
    <rect x="304" y="30" width="16" height="10" />
    <rect x="16" y="54" width="30" height="10" />
    <rect x="48" y="54" width="30" height="10" />
    <rect x="80" y="54" width="30" height="10" />
    <rect x="112" y="54" width="30" height="10" />
    <rect x="144" y="54" width="30" height="10" />
    <rect x="176" y="54" width="30" height="10" />
    <rect x="208" y="54" width="30" height="10" />
    <rect x="240" y="54" width="30" height="10" />
    <rect x="272" y="54" width="30" height="10" />
    <rect x="304" y="54" width="16" height="10" />
    <rect x="16" y="78" width="30" height="10" />
    <rect x="48" y="78" width="30" height="10" />
    <rect x="80" y="78" width="30" height="10" />
    <rect x="112" y="78" width="30" height="10" />
    <rect x="144" y="78" width="30" height="10" />
    <rect x="176" y="78" width="30" height="10" />
    <rect x="208" y="78" width="30" height="10" />
    <rect x="240" y="78" width="30" height="10" />
    <rect x="272" y="78" width="30" height="10" />
    <rect x="304" y="78" width="16" height="10" />
  </g>

  <!-- Dakbalk met ijzeren banden, en de paal naast de haard -->
  <rect x="0" y="0" width="320" height="9" fill="#241816" />
  <g fill="#5c3f28">
    <rect x="100" y="0" width="6" height="9" />
    <rect x="140" y="0" width="6" height="9" />
    <rect x="180" y="0" width="6" height="9" />
    <rect x="220" y="0" width="6" height="9" />
