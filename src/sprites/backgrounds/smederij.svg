  <g fill="#f0a04a">
    <rect x="42" y="99" width="2" height="2" />
    <rect x="24" y="96" width="2" height="2" />
  </g>

  <!-- Warmtegloed op de muur naast de haard, in uitlopende trappen -->
  <rect x="100" y="96" width="16" height="72" fill="#4a2b19" />
  <rect x="116" y="100" width="12" height="64" fill="#402619" />
  <rect x="128" y="106" width="8" height="54" fill="#38221a" />

  <!-- Blaasbalg met houten handvat en mondstuk in het vuur -->
  <rect x="96" y="122" width="12" height="7" fill="#4c545c" />
  <rect x="106" y="106" width="34" height="32" fill="#6b4a2c" />
  <rect x="106" y="106" width="34" height="3" fill="#8a6f52" />
  <rect x="108" y="116" width="30" height="2" fill="#4a3524" />
  <rect x="108" y="124" width="30" height="2" fill="#4a3524" />
  <rect x="108" y="132" width="30" height="2" fill="#4a3524" />
  <rect x="140" y="114" width="18" height="5" fill="#5c3f28" />
  <rect x="154" y="108" width="6" height="14" fill="#5c3f28" />

  <!-- IJzerstaal aan de muur naast de haard -->
  <rect x="176" y="66" width="74" height="5" fill="#5c3f28" />
  <rect x="176" y="66" width="74" height="2" fill="#7d5a36" />
  <g fill="#6f7d88">
    <rect x="182" y="71" width="5" height="30" />
    <rect x="196" y="71" width="5" height="24" />
    <rect x="210" y="71" width="5" height="34" />
    <rect x="224" y="71" width="5" height="20" />
  </g>
  <g fill="#8e98a3">
    <rect x="182" y="71" width="5" height="2" />
    <rect x="196" y="71" width="5" height="2" />
    <rect x="210" y="71" width="5" height="2" />
    <rect x="224" y="71" width="5" height="2" />
  </g>

  <!--
    Het aambeeld zelf staat sinds T35 niet meer in deze scène. De losse sprite in
    `src/sprites/forge/anvil-sheet.svg` legt zich boven op deze vloer, dus een
    tweede aambeeld zou er dubbel en uit de lijn staan.
  -->

  <!-- Koelwaterkuip; die staat in de onderste strook die op 320px overblijft -->
  <rect x="114" y="156" width="44" height="38" fill="#6b4a2c" />
  <rect x="114" y="156" width="44" height="4" fill="#7d5a36" />
  <rect x="112" y="164" width="48" height="4" fill="#4c545c" />
  <rect x="112" y="184" width="48" height="4" fill="#4c545c" />
  <rect x="120" y="160" width="32" height="30" fill="#3d4d5a" />
  <rect x="124" y="164" width="12" height="3" fill="#6f8899" />

  <!-- Gereedschapsrek rechts; blijft op een breed scherm naast het paneel staan -->
  <rect x="256" y="64" width="64" height="5" fill="#5c3f28" />
  <rect x="256" y="64" width="64" height="2" fill="#7d5a36" />
  <g fill="#6f7d88">
    <rect x="290" y="69" width="3" height="23" />
    <rect x="298" y="69" width="3" height="23" />
  </g>
  <rect x="290" y="90" width="4" height="4" fill="#8e98a3" />
  <rect x="297" y="90" width="4" height="4" fill="#8e98a3" />
  <!--
    Alleen de tang blijft aan de rek hangen. De hamer die hier eerst stond is
    weg: T35 levert nu één hamer als sprite, en twee hamers in beeld zouden
    verwarring geven over welke je moet gebruiken.
  -->

  <!-- Hangende lamp; koel licht bovenop de warmte van het vuur -->
  <rect x="270" y="69" width="3" height="5" fill="#7d8b96" />
  <rect x="262" y="74" width="20" height="4" fill="#5c6871" />
  <rect x="264" y="78" width="16" height="13" fill="#3f4a52" />
  <rect x="268" y="82" width="8" height="8" fill="#ffd166" />
  <rect x="270" y="84" width="4" height="4" fill="#fff3d0" />
  <rect x="262" y="91" width="20" height="3" fill="#5c6871" />

  <!-- Plank met helm, schild en stuk ijzer -->
  <rect x="256" y="112" width="64" height="6" fill="#5c3f28" />
  <rect x="256" y="112" width="64" height="2" fill="#7d5a36" />
  <rect x="262" y="98" width="16" height="14" fill="#6f7d88" />
  <rect x="264" y="96" width="12" height="3" fill="#8e98a3" />
