  <g fill="#3a2921">
    <rect x="0" y="76" width="96" height="14" />
    <rect x="6" y="62" width="84" height="14" />
    <rect x="14" y="48" width="68" height="14" />
    <rect x="22" y="34" width="52" height="14" />
    <rect x="28" y="22" width="40" height="12" />
    <rect x="32" y="12" width="32" height="10" />
    <rect x="36" y="2" width="24" height="10" />
  </g>
  <g fill="#5c3f28">
    <rect x="0" y="76" width="3" height="14" />
    <rect x="6" y="62" width="3" height="14" />
    <rect x="14" y="48" width="3" height="14" />
    <rect x="22" y="34" width="3" height="14" />
    <rect x="28" y="22" width="3" height="12" />
    <rect x="32" y="12" width="3" height="10" />
