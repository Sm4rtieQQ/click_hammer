<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 48" width="144" height="48" shape-rendering="crispEdges" role="presentation">
  <!--
    Aambeeld, hamer en stam in drie poses: idle, pressed, strike.

    Drie cellen van 48 bij 48 op een 16-grid, van links naar rechts.
    Het aambeeld en de stam herhalen per frame; alleen de hamer verschuift.
    De shift van de strike-pose volgt uit FACE_TOP = 25, dus de kop
    raakt het aambeeld exact en zakt er nooit doorheen.
  -->

  <!-- idle: de kop staat 8px boven het aambeeldvlak -->
